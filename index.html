<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Correcteur</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #6ea8fe;
    --accent-soft: rgba(110, 168, 254, 0.15);
    --text: #e8e9ec;
    --text-dim: #9a9fab;
    --border: #2a2d36;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 8px;
    padding: 10px 0 14px 0;
    background: var(--bg);
  }

  .paste-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }

  .paste-btn:active {
    transform: scale(0.97);
    background: rgba(110, 168, 254, 0.25);
  }

  .paste-btn.pasted {
    background: rgba(110, 254, 159, 0.15);
    border-color: #6efe9f;
    color: #6efe9f;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 12px 0;
    color: var(--text);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    position: relative;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    resize: vertical;
    font-family: inherit;
    outline: none;
  }

  .clear-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--border);
    color: var(--text-dim);
    border: none;
    border-radius: 8px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .clear-btn.visible { display: flex; }

  .main-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .main-btn:disabled { opacity: 0.6; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(15,17,21,0.3);
    border-top-color: #0f1115;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #result-section {
    display: none;
  }

  #result-section.visible { display: block; }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  #errors-count {
    font-size: 13px;
    color: var(--text-dim);
  }

  .no-errors { color: #6efe9f; }

  #result-text {
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .copy-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .note {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <button class="paste-btn" id="top-paste-btn" onclick="collerDepuisPressePapier()">
      📋 Coller le texte
    </button>
  </div>

  <h1>Correcteur</h1>

  <div class="card">
    <textarea id="input" placeholder="Colle ou écris ton texte ici..." oninput="onInputChange()"></textarea>
    <button class="clear-btn" id="clear-btn" onclick="effacer()">✕</button>
  </div>

  <button class="main-btn" id="btn" onclick="corriger()">Corriger</button>

  <div class="card" id="result-section">
    <div class="result-header">
      <span id="errors-count"></span>
      <button class="copy-btn" id="copy-btn" onclick="copier()">Copier</button>
    </div>
    <div id="result-text"></div>
  </div>

  <p class="note">Tes messages ne sont pas conservés</p>

<script>
function onInputChange() {
  const input = document.getElementById('input');
  const clearBtn = document.getElementById('clear-btn');
  clearBtn.classList.toggle('visible', input.value.length > 0);
}

function effacer() {
  document.getElementById('input').value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  document.getElementById('result-section').classList.remove('visible');
}

async function collerDepuisPressePapier() {
  const btn = document.getElementById('top-paste-btn');
  try {
    const texte = await navigator.clipboard.readText();
    if (texte) {
      const input = document.getElementById('input');
      input.value = texte;
      onInputChange();
      btn.textContent = '✓ Collé';
      btn.classList.add('pasted');
      setTimeout(() => {
        btn.textContent = '📋 Coller le texte';
        btn.classList.remove('pasted');
      }, 1200);
    }
  } catch (e) {
    // Le presse-papier peut être inaccessible (permissions) — on redonne le focus au champ
    document.getElementById('input').focus();
  }
}

async function corriger() {
  const input = document.getElementById('input').value.trim();
  if (!input) return;

  const btn = document.getElementById('btn');
  const section = document.getElementById('result-section');
  const out = document.getElementById('result-text');
  const errCount = document.getElementById('errors-count');

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Correction en cours…';
  section.classList.remove('visible');

  try {
    const params = new URLSearchParams();
    params.append('text', input);
    params.append('language', 'fr');
    params.append('enabledOnly', 'false');

    const res = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params
    });

    const data = await res.json();
    const matches = data.matches || [];

    if (matches.length === 0) {
      out.innerHTML = '<span class="no-errors">Aucune erreur détectée — ton message est impeccable ✓</span>';
      errCount.textContent = '';
    } else {
      let corrected = input;
      const sorted = [...matches].sort((a, b) => b.offset - a.offset);
      for (const match of sorted) {
        if (match.replacements && match.replacements.length > 0) {
          const before = corrected.substring(0, match.offset);
          const after = corrected.substring(match.offset + match.length);
          corrected = before + match.replacements[0].value + after;
        }
      }
      out.textContent = corrected;
      const n = matches.length;
      errCount.textContent = n === 1 ? '1 correction effectuée' : `${n} corrections effectuées`;
    }

    section.classList.add('visible');
  } catch (e) {
    out.textContent = 'Une erreur est survenue. Vérifie ta connexion et réessaie.';
    section.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Corriger';
  }
}

function copier() {
  const text = document.getElementById('result-text').innerText;
  navigator.clipboard.writeText(text);
  const btn = document.getElementById('copy-btn');
  const original = btn.textContent;
  btn.textContent = 'Copié !';
  setTimeout(() => { btn.textContent = original; }, 1200);
}
</script>

</body>
</html>
